# This is a Databricks asset bundle definition for marvelous-databricks-course-WmWessels.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: marvelous-databricks-course-WmWessels

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: UNPAUSED


resources:
  jobs:
    airline-delay:
      name: airline-delay-workflow
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Europe/Amsterdam"
        pause_status: ${var.schedule_pause_status}
      tags:
        project_name: airline-delay
      job_clusters:
        - job_cluster_key: airline-delay-cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            data_security_mode: "SINGLE_USER"
            node_type_id: "r3.xlarge"
            driver_node_type_id: "r3.xlarge"
            autoscale:
              min_workers: 1
              max_workers: 1

      tasks:
        - task_key: "preprocessing"
          job_cluster_key: airline-delay-cluster
          spark_python_task:
            python_file: "src/scripts/01.process_data.py"
          libraries:
            - whl: ./dist/*.whl
        - task_key: "train_model"
          job_cluster_key: airline-delay-cluster
          depends_on:
            - task_key: preprocessing
          spark_python_task:
            python_file: src/scripts/02.train_register_basic_model.py
            parameters:
              - "--git_sha"
              - ${var.git_sha}
              - "--job_run_id"
              - "{{job.id}}"
              - "--branch"
              - ${var.branch}
          libraries:
            - whl: ./dist/*.whl
        - task_key: model_updated
          condition_task:
            op: "EQUAL_TO"
            left: "{{tasks.train_model.values.model_updated}}"
            right: "1"
          depends_on:
            - task_key: train_model
        - task_key: deploy_model
          depends_on:
            - task_key: model_updated
              outcome: "true"
          job_cluster_key: airline-delay-cluster
          spark_python_task:
            python_file: "src/scripts/03.deploy_model.py"
          libraries:
            - whl: ./dist/*.whl

targets:
  dev:
    cluster_id: 0302-143801-8o7i96bn
    mode: development
    default: true
    workspace:
      host: https://dbc-4894232b-9fc5.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED

  ## Optionally, there could be 'staging' or 'prod' targets here.
